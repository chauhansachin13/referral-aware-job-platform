apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: referralhub

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - ingress.yaml
  - networkpolicy.yaml
  # secret.example.yaml is intentionally excluded: the real Secret is created out of band.

commonLabels:
  app.kubernetes.io/part-of: referralhub
