apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: referralhub
  namespace: referralhub
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "12m"
    # Resume downloads must never be cached by an intermediary.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Content-Type-Options: nosniff";
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["referralhub.example.com"]
      secretName: referralhub-tls
  rules:
    - host: referralhub.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: referralhub
                port:
                  name: http
