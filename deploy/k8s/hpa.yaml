apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: referralhub
  namespace: referralhub
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: referralhub
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      # Slow to scale down: crawl work is bursty, and flapping replicas mean repeatedly
      # re-seeding the crawl queue and rebalancing every consumer group.
      stabilizationWindowSeconds: 300
