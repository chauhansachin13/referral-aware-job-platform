# Template only. Do not commit a filled-in copy of this file.
#
# In a real cluster these values come from External Secrets, Sealed Secrets or the cloud
# provider's secret manager. Generate the two application secrets with:
#   kubectl -n referralhub create secret generic referralhub-secrets \
#     --from-literal=DATABASE_PASSWORD='...' \
#     --from-literal=MINIO_SECRET_KEY='...' \
#     --from-literal=REFERRALHUB_STORAGE_ENCRYPTIONKEY="$(openssl rand -base64 32)" \
#     --from-literal=REFERRALHUB_STORAGE_URLSIGNINGSECRET="$(openssl rand -hex 32)" \
#     --from-literal=REFERRALHUB_AUTH_JWTSECRET="$(openssl rand -base64 48)"
#
# Rotating REFERRALHUB_STORAGE_ENCRYPTIONKEY needs a re-encryption pass over existing objects;
# the key_id column on `resume` exists so a rotation can be tracked per object.
apiVersion: v1
kind: Secret
metadata:
  name: referralhub-secrets
  namespace: referralhub
type: Opaque
stringData:
  DATABASE_URL: "jdbc:postgresql://postgres.referralhub.svc.cluster.local:5432/referralhub"
  DATABASE_USER: "referralhub"
  DATABASE_PASSWORD: "REPLACE_ME"
  MINIO_ACCESS_KEY: "REPLACE_ME"
  MINIO_SECRET_KEY: "REPLACE_ME"
  REFERRALHUB_STORAGE_ENCRYPTIONKEY: "REPLACE_ME_BASE64_32_BYTES"
  REFERRALHUB_STORAGE_URLSIGNINGSECRET: "REPLACE_ME"
  REFERRALHUB_AUTH_JWTSECRET: "REPLACE_ME_AT_LEAST_32_BYTES"
