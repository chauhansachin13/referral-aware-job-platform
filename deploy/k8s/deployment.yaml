apiVersion: apps/v1
kind: Deployment
metadata:
  name: referralhub
  namespace: referralhub
  labels:
    app.kubernetes.io/name: referralhub
    app.kubernetes.io/component: api
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never fewer than the current replica count during a rollout: the crawl schedule and the
      # outbox relay are shared, and briefly losing a third of the fleet lets the backlog grow.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: referralhub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: referralhub
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      # Spread across zones: every replica runs its own relay and crawler, so losing a zone
      # should cost throughput, not availability.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: referralhub
      containers:
        - name: app
          image: ghcr.io/chauhansachin13/referral-aware-job-platform:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: referralhub-config
            - secretRef:
                name: referralhub-secrets
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=70 -XX:+UseZGC -XX:+ExitOnOutOfMemoryError"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              # No CPU limit on purpose: throttling a JVM mid-GC turns a latency spike into a
              # readiness failure. Memory is limited because a leak must not evict neighbours.
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            # Flyway migrations run before the context is ready; a cold start on a big schema
            # can legitimately take a while, and this is what stops the liveness probe from
            # killing the pod mid-migration.
            httpGet: { path: /actuator/health/liveness, port: http }
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              # Let the load balancer stop sending traffic before the JVM starts shutting down.
              exec:
                command: ["sh", "-c", "sleep 10"]
      terminationGracePeriodSeconds: 45
      volumes:
        - name: tmp
          emptyDir: {}
