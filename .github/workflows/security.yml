name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Dependencies rot without any commit touching them, so this runs on a timer too.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    # Only on a schedule and on demand: PIT re-runs the suite once per surviving mutant, which
    # is minutes rather than seconds and is not worth blocking a pull request on.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Run PIT
        run: ./gradlew :dedup:pitest :trust:pitest :referral:pitest :search:pitest --no-daemon
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: mutation-reports
          path: modules/*/build/reports/pitest
          retention-days: 14

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
      - name: Build for analysis
        run: ./gradlew :app:bootJar -x test --no-daemon
      - uses: github/codeql-action/analyze@v3

  dependency-scan:
    name: Dependency and image scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-fs.sarif
          exit-code: '0'

      - name: Upload results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
