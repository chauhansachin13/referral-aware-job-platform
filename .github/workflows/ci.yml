name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # GitHub runners ship a working Docker daemon, so the Testcontainers tests that skip on a
      # developer laptop always run here. That is the point of the skip condition: green locally,
      # exhaustive in CI.
      - name: Verify Docker is available
        run: docker info --format 'server {{.ServerVersion}}'

      - name: Build and test
        env:
          REFERRALHUB_FORCE_DOCKER: 'true'
          TESTCONTAINERS_REUSE_ENABLE: 'false'
        run: ./gradlew build --no-daemon --stacktrace

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: |
            modules/*/build/reports/tests/test
            modules/*/build/test-results/test
          retention-days: 7

      - name: Architecture rules
        # Reported separately so a boundary violation is obvious in the job list rather than
        # buried among 300 test names.
        if: always()
        run: ./gradlew :app:test --tests '*ArchitectureTest*' --no-daemon

      - name: Publish coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-coverage
          path: modules/*/build/reports/jacoco
          retention-days: 7

      - name: Summarise results
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, re, collections
          tot = collections.Counter()
          for f in glob.glob("modules/*/build/test-results/test/*.xml"):
              mod = f.split("/")[1]
              tag = re.search(r'<testsuite[^>]*>', open(f, errors="ignore").read(2000))
              if not tag: continue
              g = lambda n: int((re.search(n + r'="(\d+)"', tag.group(0)) or [0, 0])[1])
              for k in ("tests", "skipped", "failures", "errors"):
                  tot[(mod, k)] += g(k)
          print("## Test results\n")
          print("| module | tests | passed | skipped | failed |")
          print("|---|---:|---:|---:|---:|")
          for mod in sorted({k[0] for k in tot}):
              t, s = tot[(mod, "tests")], tot[(mod, "skipped")]
              f = tot[(mod, "failures")] + tot[(mod, "errors")]
              print(f"| {mod} | {t} | {t - s - f} | {s} | {f} |")
          PY

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose:
    name: Compose smoke test
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      # Proves the claim the README makes: the whole platform comes up from one command.
      - name: Bring the stack up
        run: docker compose up -d --build --wait --wait-timeout 600

      - name: Smoke test
        run: ./scripts/smoke-test.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
